services:
  newshabit-user:
    build:
      context: ..
      dockerfile: user/Dockerfile
    image: ${NEWSHABIT_USER_IMAGE_NAME}:${NEWSHABIT_USER_IMAGE_TAG}
    container_name: newshabit-user
    cpus: 0.2
    mem_limit: 256M
    restart: on-failure:3
    volumes:
      - /data/user/log:/app/log
      - /data/auth:/data/auth
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    ports:
      - "8085:8085"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx256m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: "app,auth,jdbc"
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      NEWSHABIT_AUTH_URL: ${NEWSHABIT_AUTH_URL}
      INTERNAL_ACCESS_TOKEN: ${INTERNAL_ACCESS_TOKEN}
      RDS_URL: ${RDS_URL}
      RDS_USERNAME: ${RDS_USERNAME}
      RDS_PASSWORD: ${RDS_PASSWORD}

    networks:
      - newshabit-3

networks:
  newshabit-3:
    driver: bridge
