services:
  newshabit:
    build:
      context: ..
      dockerfile: newshabit/Dockerfile
    image: ${NEWSHABIT_IMAGE_NAME}:${NEWSHABIT_IMAGE_TAG}
    container_name: newshabit
    cpus: 0.8
    mem_limit: 1024M
    restart: on-failure:3
    volumes:
      - /data/newshabit/log:/app/log
      - /data/auth:/data/auth
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: "ai,app,auth,jdbc,spring-cloud-stream"

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PROMPT: ${GEMINI_PROMPT}
      HEADLINE_URI: ${HEADLINE_URI}
      USER_AGENT: ${USER_AGENT}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      RDS_URL: ${RDS_URL}
      RDS_USERNAME: ${RDS_USERNAME}
      RDS_PASSWORD: ${RDS_PASSWORD}
      CRAWL_TOPIC: ${CRAWL_TOPIC}
      REFINED_NEWS_TOPIC: ${REFINED_NEWS_TOPIC}
      KAFKA_URL: ${KAFKA_URL}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL}

    networks:
      - newshabit

networks:
  newshabit:
    driver: bridge
